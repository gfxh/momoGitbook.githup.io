name: Update Stats and Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get last commit date
        id: last-commit
        run: LAST_COMMIT=$(git log -1 --format=%cd --date=iso) && echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

      - name: Count characters in markdown files
        id: word-count
        run: |
          TOTAL_CHARS=$(python3 << 'PYEOF'
          import os, re

          EXCLUDE_DIRS = {'.claude', '.git', '.github', '.vscode', 'assets'}

          def strip_non_content(text):
              lines = []
              for line in text.splitlines():
                  stripped = line.strip()
                  # skip empty lines
                  if not stripped:
                      continue
                  # skip horizontal rules
                  if re.fullmatch(r'[-*_]{3,}', stripped):
                      continue
                  lines.append(stripped)
              result = '\n'.join(lines)
              # remove image syntax: ![alt](url) -> remove entirely
              result = re.sub(r'!\[.*?\]\(.*?\)', '', result)
              # link syntax: [text](url) -> keep text
              result = re.sub(r'\[([^\]]*)\]\(.*?\)', r'\1', result)
              return result

          total = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS and not d.startswith('.')]
              for f in files:
                  if f.endswith('.md'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8') as fp:
                              cleaned = strip_non_content(fp.read())
                              total += len(cleaned.replace('\n', ''))
                      except:
                          pass
          print(total)
          PYEOF
          )
          echo "total_words=$TOTAL_CHARS" >> $GITHUB_OUTPUT

      - name: Update stats.json
        run: |
          echo "{" > stats.json
          echo "  \"lastUpdate\": \"$(date -d "${{ steps.last-commit.outputs.last_commit }}" +%Y-%m-%d)\"," >> stats.json
          echo "  \"totalWords\": ${{ steps.word-count.outputs.total_words }}" >> stats.json
          echo "}" >> stats.json
          cat stats.json

      - name: Commit stats.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update stats.json
          file_pattern: stats.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
