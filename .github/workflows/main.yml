name: Update Stats and Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: Get last commit date
        id: last-commit
        run: LAST_COMMIT=$(git log -1 --format=%cd --date=iso) && echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

      - name: Count words in markdown files
        id: word-count
        run: TOTAL_WORDS=$(find . -name "*.md" -type f -exec cat {} \; | wc -c) && echo "total_words=$TOTAL_WORDS" >> $GITHUB_OUTPUT

      - name: Update stats.json
        run: |
          echo "{" > stats.json
          echo "  \"lastUpdate\": \"$(date -d "${{ steps.last-commit.outputs.last_commit }}" +%Y-%m-%d)\"," >> stats.json
          echo "  \"totalWords\": ${{ steps.word-count.outputs.total_words }}" >> stats.json
          echo "}" >> stats.json
          cat stats.json

      - name: Commit stats.json
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          commit_message: Update stats.json
          file_pattern: stats.json

      - name: Setup Pages
        uses: actions/configure-pages@v6.5.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5