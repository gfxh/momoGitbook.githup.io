name: Update Stats

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get last commit date
        id: last-commit
        run: LAST_COMMIT=$(git log -1 --format=%cd --date=iso) && echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

      - name: Count words in markdown files
        id: word-count
        run: TOTAL_WORDS=$(find . -name "*.md" -type f -exec cat {} \; | wc -c) && echo "total_words=$TOTAL_WORDS" >> $GITHUB_OUTPUT

      - name: Update stats.json
        run: |
          echo "{" > stats.json
          echo "  \"lastUpdate\": \"$(date -d "${{ steps.last-commit.outputs.last_commit }}" +%Y-%m-%d)\"," >> stats.json
          echo "  \"totalWords\": ${{ steps.word-count.outputs.total_words }}" >> stats.json
          echo "}" >> stats.json
          cat stats.json

      - name: Commit and push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: false