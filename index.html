    .hero-title {

      letter-spacing: 0;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.15s;

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .hero-title {
        color: transparent;
        background: linear-gradient(100deg, #f3f5f4 35%, #5eead4 50%, #f3f5f4 65%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: heroFadeUp 0.8s ease-out 0.15s both, titleShimmer 6s ease-in-out 1.1s infinite;
      }
    }

    @keyframes titleShimmer {
      0%, 55% { background-position: 100% 0; }
      100% { background-position: -120% 0; }
    }

    .hero-subtitle {
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: #c5d0cf;
      font-weight: 400;
      margin: 0 0 10px;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.3s;

    .hero-desc {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: #9aa9a8;

      max-width: 560px;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.45s;

    .hero-title.is-typing::after,
    .hero-subtitle.is-typing::after,
    .hero-desc.is-typing::after {

      margin-left: 0.12em;
      vertical-align: 0.04em;
      font-weight: 300;

    .hero-title.is-typing::after {

    }

    .hero-subtitle.is-typing::after,
    .hero-desc.is-typing::after {
      color: #5eead4;
    }

    .hero-title.is-typing {
      color: #f3f5f4;
      background: none;
      -webkit-text-fill-color: #f3f5f4;
    }

    .hero-title.is-color-cycling,
    .hero-subtitle.is-color-cycling,
    .hero-desc.is-color-cycling {
      color: #5eead4;
    }

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .hero-title.is-color-cycling,
      .hero-subtitle.is-color-cycling,

        color: transparent;

        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textColorFlow 4.4s linear infinite;
      }
    }

    @keyframes typingCursor {

      49%, 100% { opacity: 0; }

    @keyframes textColorFlow {
      from { background-position: 100% 0; }

    .mini-widgets {

    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {

      .hero-subtitle.is-typing::after,

      .hero-title.is-color-cycling,
      .hero-subtitle.is-color-cycling,

        animation: none;
      }
    }

    /* 滚动指示器 */
    .hero-scroll-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);

      animation: floatHint 1.6s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    @keyframes floatHint {
      0%, 100% { transform: translateX(-50%) translateY(0); }

    }

    /* ========================================
     * 滚动文字区
     * ======================================== */

    .scroll-text-section {
      display: grid;
      grid-template: minmax(500px, 78vh) / minmax(0, 1fr);
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-top: 1px solid rgba(121, 165, 158, 0.2);

    .scroll-text {

      z-index: 2;

      text-align: left;
      font-size: clamp(2rem, 4.8vw, 4.4rem);

      line-height: 1.8;
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.62);
    }

    .scroll-text-section::after {
      content: '';
      grid-area: 1 / 1;
      z-index: 1;
      background: linear-gradient(90deg, rgba(4, 10, 10, 0.8) 0%, rgba(5, 12, 12, 0.46) 52%, rgba(5, 12, 12, 0.2) 100%), linear-gradient(0deg, rgba(4, 9, 9, 0.66) 0%, transparent 58%);

    .scroll-text span {

    .scroll-text span.is-lit {

    /* 区段媒体：静默融入，不抢夺文字注意力 */
    .scroll-media {
      grid-area: 1 / 1;
      display: block;
      max-width: none;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      z-index: 0;
      border-radius: 0;
      opacity: 1;
      filter: saturate(0.7) contrast(0.92) brightness(0.68);
      object-fit: cover;
      background: #101214;
      transition: opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease;
    }

    .scroll-media:hover {
      filter: saturate(0.84) contrast(0.98) brightness(0.74);
      transform: scale(1.015);
    }

    .scroll-text-section:nth-of-type(2) .scroll-media { object-position: center center; }
    .scroll-text-section:nth-of-type(3) .scroll-media { object-position: 45% center; }
    .scroll-text-section:nth-of-type(4) .scroll-media { object-position: center center; }
    .scroll-text-section:nth-of-type(5) .scroll-media { object-position: center 38%; }

  <script>

    (function initHeroTypewriter() {
      const targets = document.querySelectorAll('[data-typewriter]');
      if (targets.length === 0) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion) return;

      const items = Array.from(targets).map(function (target) {
        const text = target.textContent.trim();
        target.setAttribute('aria-label', text);
        target.textContent = '';
        return {
          target: target,
          chars: Array.from(text),
          speed: Number(target.dataset.typeSpeed) || 45
        };
      });

      function wait(duration) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, duration);
        });
      }

      function setCursor(target) {
        items.forEach(function (item) {
          item.target.classList.toggle('is-typing', item.target === target);
        });
      }

      function setColorCycle(active) {
        items.forEach(function (item) {
          item.target.classList.toggle('is-color-cycling', active);
        });
      }

      function type(item) {
        return new Promise(function (resolve) {
          let index = 0;
          setCursor(null);
          const timer = window.setInterval(function () {
            item.target.textContent += item.chars[index];
            index += 1;
            setCursor(item.target);
            if (index >= item.chars.length) {
              window.clearInterval(timer);
              resolve();
            }
          }, item.speed);
        });
      }

      function erase(item) {
        return new Promise(function (resolve) {
          setCursor(item.target);
          const timer = window.setInterval(function () {
            item.target.textContent = item.target.textContent.slice(0, -1);
            if (item.target.textContent.length === 0) {
              window.clearInterval(timer);
              setCursor(null);
              resolve();
            }
          }, Math.max(22, item.speed * 0.55));
        });
      }

      (async function loopTypewriter() {
        await wait(180);
        while (true) {
          setColorCycle(false);
          for (const item of items) await type(item);
          setColorCycle(true);
          setCursor(items[items.length - 1].target);
          await wait(2600);
          setColorCycle(false);
          for (const item of items.slice().reverse()) await erase(item);
          await wait(480);
        }
      })();
    })();

    (function initScrollTexts() {
      const sections = document.querySelectorAll('.scroll-text');
      if (sections.length === 0) return;


      sections.forEach(function (el) {
        const text = el.dataset.text || el.textContent;
        const chars = Array.from(text);
        el.innerHTML = '';
        chars.forEach(function (ch) {
          const span = document.createElement('span');
          span.textContent = ch;
          span.style.opacity = '0.18';
          el.appendChild(span);
        });
      });

      let ticking = false;

      function update() {
        sections.forEach(function (el) {
          const rect = el.getBoundingClientRect();
          const winH = window.innerHeight;
          // 只在元素进入视口时计算
          if (rect.bottom < 0 || rect.top > winH) return;

          const spans = Array.from(el.querySelectorAll('span'));
          const total = spans.length;
          if (total === 0) return;

          // 元素中点越靠近视口顶部，点亮越多字符
          const ratio = 1 - (rect.top + rect.height * 0.4) / winH;
          const litCount = Math.round(Math.max(0, Math.min(1, ratio)) * total);

          spans.forEach(function (span, i) {
            if (i < litCount) {
              span.style.opacity = '0.92';
              span.style.color = i < litCount - 1 ? '#f3f5f4' : '#5eead4';
            } else {
              span.style.opacity = '0.18';
              span.style.color = '';
            }
          });
        });

        ticking = false;
      }

      window.addEventListener('scroll', function () {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener('resize', function () {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      });

      update();
    })();


    (function initScrollHint() {
      const hint = document.getElementById('heroScrollHint');
      if (!hint) return;

      window.addEventListener('scroll', function () {
        hint.style.opacity = window.scrollY > 30 ? '0' : '1';
      }, { passive: true });
    })();

    (function initClockWidget() {
      const clockTarget = document.getElementById('widgetClock');
      const dateTarget = document.getElementById('widgetDate');
      if (!clockTarget || !dateTarget) return;

      function updateClock() {
        const now = new Date();
        clockTarget.textContent = now.toLocaleTimeString('zh-CN', {
          hour12: false,
          hour: '2-digit',
          minute: '2-digit'
        });
        dateTarget.textContent = now.toLocaleDateString('zh-CN', {
          month: 'long',
          day: 'numeric',
          weekday: 'short'
        });
      }

      updateClock();
      window.setInterval(updateClock, 1000);
    })();

  </script>
