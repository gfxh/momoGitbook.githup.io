    html, body {

    /* ========================================
     * 首页 Hero 区

    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 80px;
      position: relative;
    }

    .hero-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin-bottom: 36px;

      box-shadow: 0 0 40px rgba(94, 234, 212, 0.15);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      object-fit: cover;
    }

    .hero-avatar:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 56px rgba(94, 234, 212, 0.28);
    }

    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      color: #f3f5f4;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.15s;
    }

    .hero-subtitle {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #94a3a6;
      font-weight: 400;
      margin: 0 0 10px;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.3s;
    }

    .hero-desc {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: #6b7580;
      font-weight: 300;
      line-height: 1.85;
      max-width: 560px;
      animation: heroFadeUp 0.8s ease-out both;
      animation-delay: 0.45s;
    }

    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 滚动指示器 */
    .hero-scroll-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      animation: floatHint 1.6s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    @keyframes floatHint {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(4px); }
    }

    /* ========================================
     * 滚动文字区
     * ======================================== */

    .scroll-text-section {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 120px 20px;
    }

    .scroll-text {
      text-align: center;
      font-size: clamp(1.6rem, 4vw, 3.2rem);
      font-weight: 700;
      color: #f3f5f4;
      user-select: none;
      line-height: 1.8;
    }

    .scroll-text span {
      display: inline-block;
      transition: opacity 0.45s ease-out;
      opacity: 0.18;
    }

    .scroll-text span.is-lit {
      opacity: 1;
    }

    /* 区段配图：静默融入，不抢夺文字注意力 */
    .scroll-img {
      display: block;
      max-width: 960px;
      width: 100%;
      border-radius: 12px;
      opacity: 0.12;
      filter: saturate(0.5);
      transition: opacity 0.6s ease, filter 0.6s ease;
    }

    .scroll-img:hover {
      opacity: 0.5;
      filter: saturate(1);
    }

    @media (max-width: 640px) {
      .scroll-img { max-width: 95%; }
    }

    /* ========================================
     * Projects 区
     * ======================================== */

    .projects-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px 80px;
    }

    .projects-section h2 {
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      color: #f3f5f4;
      margin: 0 0 12px;
    }

    .projects-section .section-sub {
      text-align: center;
      font-size: 1.05rem;
      color: #6b7580;
      font-weight: 300;
      margin: 0 0 48px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .project-card {
      display: block;
      padding: 28px 32px;
      background: rgba(26, 31, 34, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      text-decoration: none;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: rgba(94, 234, 212, 0.26);
      background: rgba(30, 36, 39, 0.9);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .project-card h3 {

      font-weight: 700;

    .project-card p {

    .project-card .card-meta {

    .project-card .card-meta span {

      padding: 20px 20px 40px;
      font-size: 0.85rem;

    }
  </style>

  <script>

    (function initScrollTexts() {
      const sections = document.querySelectorAll('.scroll-text');
      if (sections.length === 0) return;


      sections.forEach(function (el) {
        const text = el.dataset.text || el.textContent;
        const chars = Array.from(text);
        el.innerHTML = '';
        chars.forEach(function (ch) {
          const span = document.createElement('span');
          span.textContent = ch;
          span.style.opacity = '0.18';
          el.appendChild(span);
        });
      });

      let ticking = false;

      function update() {
        sections.forEach(function (el) {
          const rect = el.getBoundingClientRect();
          const winH = window.innerHeight;
          // 只在元素进入视口时计算
          if (rect.bottom < 0 || rect.top > winH) return;

          const spans = Array.from(el.querySelectorAll('span'));
          const total = spans.length;
          if (total === 0) return;

          // 元素中点越靠近视口顶部，点亮越多字符
          const ratio = 1 - (rect.top + rect.height * 0.4) / winH;
          const litCount = Math.round(Math.max(0, Math.min(1, ratio)) * total);

          spans.forEach(function (span, i) {
            if (i < litCount) {
              span.style.opacity = '0.92';
              span.style.color = i < litCount - 1 ? '#f3f5f4' : '#5eead4';
            } else {
              span.style.opacity = '0.18';
              span.style.color = '';
            }
          });
        });

        ticking = false;
      }

      window.addEventListener('scroll', function () {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener('resize', function () {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      });

      update();
    })();


    (function initScrollHint() {
      const hint = document.getElementById('heroScrollHint');
      if (!hint) return;

      window.addEventListener('scroll', function () {
        hint.style.opacity = window.scrollY > 30 ? '0' : '1';
      }, { passive: true });
    })();


    (function loadProjects() {
      const grid = document.getElementById('projectsGrid');
      if (!grid) return;

      const projects = [
        {
          name: 'momoGitbook',
          desc: 'Personal knowledge base & CTF writeups, built with vanilla HTML/CSS/JS and markdown-it.',
          demo: null,
          source: 'https://github.com/gfxh/momoGitbook.githup.io'
        },
        {
          name: 'Coming Soon',
          desc: 'More projects on the way — security tools, CTF challenges, and automation scripts.',
          demo: null,
          source: null
        }
      ];

      var html = '';
      projects.forEach(function (p) {
        html += '<div class="project-card">';
        html += '<h3>' + escapeHtml(p.name) + '</h3>';
        html += '<p>' + escapeHtml(p.desc) + '</p>';
        html += '<div class="card-meta">';
        if (p.demo) {
          html += '<a href="' + escapeHtml(p.demo) + '" target="_blank" rel="noopener noreferrer"><span>Demo</span></a>';
        }
        if (p.source) {
          html += '<a href="' + escapeHtml(p.source) + '" target="_blank" rel="noopener noreferrer"><span>Source</span></a>';
        }
        html += '</div>';
        html += '</div>';
      });
      grid.innerHTML = html;
    })();

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
