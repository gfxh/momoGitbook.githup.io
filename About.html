  <!-- 页面专属样式：夕阳背景、云、太阳、粒子（内嵌，仅作用于 About.html） -->
  <style>
    /* 覆盖或补充 main.css，确保仅在本页面生效 */
    .main-container {
      position: relative;
      min-height:  box-sizing: border-box;
      overflow: hidden;
      background: transparent; /* 背景由 canvas 提供 */
    }

    /* 背景画布，覆盖整个 main-container */
    #sunset-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    /* 太阳 */
    .sun {
      position: absolute;
      z-index: 1;
      left: 50%;
      transform: translateX(-50%);
      bottom: 8%;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255,230,150,0.95) 0%, rgba(255,140,50,0.75) 30%, rgba(255,80,30,0.55) 60%, rgba(255,60,10,0.15) 100%);
      filter: blur(6px);
      box-shadow: 0 0 80px 24px rgba(255,140,50,0.12), 0 0 24px rgba(255,200,120,0.28);
      animation: sunPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sunPulse {
      0% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.03); opacity: 0.92; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    /* 云朵（多个层级） */
    .cloud {
      position: absolute;
      z-index: 2;
      top: 12%;
      width: 420px;
      height: 120px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.7));
      border-radius: 60px;
      filter: blur(8px);
      opacity: 0.85;
      pointer-events: none;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      width: 60%;
      height: 120%;
      top: -20%;
      left: 10%;
      border-radius: 50%;
    }

    .cloud::after {
      left: auto;
      right: 10%;
      width: 50%;
      height: 110%;
    }

    /* 不同云层大小 */
    .cloud.small { width: 260px; height: 80px; filter: blur(6px); opacity: 0.7; }
    .cloud.large { width: 560px; height: 160px; filter: blur(12px); opacity: 0.95; top: 6%; }

    /* 云漂浮动画（不同速度与方向） */
    @keyframes cloudFloatLeft {
      from { transform: translateX(120%); }
      to { transform: translateX(-140%); }
    }

    @keyframes cloudFloatRight {
      from { transform: translateX(-140%); }
      to { transform: translateX(120%); }
    }

    .cloud.layer1 { animation: cloudFloatLeft 36s linear infinite; top: 8%; left: -20%; }
    .cloud.layer2 { animation: cloudFloatRight 48s linear infinite; top: 18%; left: 10%; opacity: 0.8; transform: scale(0.95); }
    .cloud.layer3 { animation: cloudFloatLeft 60s linear infinite; top: 26%; left: -30%; transform: scale(1.1); opacity: 0.9; }

    /* 内容卡片提升可读性，毛玻璃效果 */
    .page-content {
      position: relative;
      z-index: 3;
      max-width: 900px;
      margin: 60px auto;
      padding: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      color: #fff;
      animation: contentEnter 900ms ease-out;
    }

    @keyframes contentEnter {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 适配浅色模式（如果你启用了 body.light-mode） */
    body.light-mode .page-content {
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.6));
      color: #222;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    /* 右下角粒子（微小光点）容器 */
    .particle-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* 小屏适配 */
    @media (max-width: 700px) {
      .sun { width: 120px; height: 120px; bottom: 10%; }
      .page-content { margin: 40px 16px; padding: 22px; }
      .cloud.large { display: none; } /* 简化移动端显示 */
    }
  </style>

  <!-- 页面专属脚本（内嵌） -->
  <script>
    // ABOUT 页面专属：夕阳、云、粒子
    (function () {
      const canvas = document.getElementById('sunset-canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let width, height, DPR;

      function resize() {
        DPR = window.devicePixelRatio || 1;
        width = canvas.clientWidth;
        height = canvas.clientHeight;
        canvas.width = Math.floor(width * DPR);
        canvas.height = Math.floor(height * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      // 渐变天空绘制（包含薄雾层）
      function drawSky(time) {
        // 天空主渐变：顶部到地平线
        const g = ctx.createLinearGradient(0, 0, 0, height);
        // 夕阳色带（可微动画）
        const t = (Math.sin(time * 0.0003) + 1) / 2; // 0..1
        // interpolation for subtle motion
        const topColor = lerpColor('#ff9a66', '#ff6b35', t);
        const midColor = lerpColor('#ffb27a', '#ff8c42', t);
        const botColor = lerpColor('#ffd7a6', '#ffb347', t);

        g.addColorStop(0, topColor);
        g.addColorStop(0.45, midColor);
        g.addColorStop(1, botColor);

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, height);

        // 添加远处薄雾层（柔和带）
        const fogAlpha = 0.08 + 0.02 * Math.sin(time * 0.0004);
        ctx.fillStyle = `rgba(255,220,200,${fogAlpha})`;
        ctx.fillRect(0, height * 0.55, width, height * 0.45);
      }

      // 线性插色辅助
      function lerpColor(a, b, t) {
        const ca = hexToRgb(a);
        const cb = hexToRgb(b);
        const cr = Math.round(ca.r + (cb.r - ca.r) * t);
        const cg = Math.round(ca.g + (cb.g - ca.g) * t);
        const cbv = Math.round(ca.b + (cb.b - ca.b) * t);
        return `rgb(${cr},${cg},${cbv})`;
      }

      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(s => s + s).join('');
        }
        const int = parseInt(hex, 16);
        return { r: (int >> 16) & 255, g: (int >> 8) & 255, b: int & 255 };
      }

      // 粒子小光点（用于近景闪烁）
      const particles = [];
      function initParticles() {
        particles.length = 0;
        const count = Math.max(12, Math.floor((width * height) / 80000));
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: height * (0.6 + Math.random() * 0.35),
            r: 0.8 + Math.random() * 2.2,
            a: 0.2 + Math.random() * 0.8,
            vx: (Math.random() - 0.5) * 0.08,
            vy: -0.02 - Math.random() * 0.06,
            life: Math.random() * 2000
          });
        }
      }

      function drawParticles(delta) {
        for (const p of particles) {
          p.x += p.vx * delta;
          p.y += p.vy * delta * 0.8;
          p.life += delta;
          // wrap horizontally
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;
          // reset if too high
          if (p.y < height * 0.45) {
            p.y = height * (0.6 + Math.random() * 0.35);
            p.x = Math.random() * width;
          }
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 8);
          const alpha = 0.05 + 0.35 * Math.abs(Math.sin(p.life * 0.002 + p.x));
          glow.addColorStop(0, `rgba(255,220,160,${alpha})`);
          glow.addColorStop(0.3, `rgba(255,140,60,${alpha * 0.6})`);
          glow.addColorStop(1, 'rgba(255,140,60,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 主渲染循环
      let last = performance.now();
      function frame(now) {
        const delta = now - last;
        last = now;
        drawSky(now);
        drawParticles(delta);

        requestAnimationFrame(frame);
      }

      // 处理画布尺寸与初始化
      function start() {
        resize();
        initParticles();
        last = performance.now();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', () => {
        resize();
        initParticles();
      });

      // 初次运行
      if (canvas) start();

      // ---- 页面 DOM 云朵透明度与太阳亮度微动画（用 DOM 动画增强效果） ----
      (function domEffects() {
        const sun = document.querySelector('.sun');
        if (!sun) return;
        let t0 = performance.now();
        function loop(ts) {
          const t = (ts - t0) * 0.001;
          // 太阳上下微浮
          const dy = Math.sin(t * 0.5) * 6;
          sun.style.transform = `translateX(-50%) translateY(${dy}px)`;
          // 太阳光晕 intensity
          const glow = 0.12 + 0.08 * (Math.sin(t * 1.2) + 1) / 2;
          sun.style.boxShadow = `0 0 80px 24px rgba(255,140,50,${glow}), 0 0 24px rgba(255,200,120,${glow*2})`;
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();

      // 结束 IIFE
    })();
  </script>
