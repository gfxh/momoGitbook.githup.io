<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克动荡 - Tank Trouble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
        }

        #gameCanvas {
            background-color: #2c3e50;
            border: 4px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: block;
        }

        .game-info {
            color: white;
            margin-bottom: 15px;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .player-score {
            padding: 10px 30px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .player1 {
            border: 3px solid #e74c3c;
        }

        .player2 {
            border: 3px solid #3498db;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <h2>坦克动荡 - Tank Trouble</h2>
            <p>玩家1: WASD移动 + Q射击 | 玩家2: 方向键移动 + M射击</p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="score-board">
            <div class="player-score player1">玩家1 得分: <span id="score1">0</span></div>
            <div class="player-score player2">玩家2 得分: <span id="score2">0</span></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
