  <script>
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
      // 加载保存的主题偏好
      loadSavedTheme();
      
      // 统计卡片功能
      const BLOG_CREATE_DATE = '2025-12-18';
      const user = window.location.hostname.split('.')[0];
      const repo = user + '.github.io';
      
      function calcRunTime() {
        const start = new Date(BLOG_CREATE_DATE);
        const now = new Date();
        const days = Math.floor((now - start) / 86400000);
        const months = Math.floor(days / 30);
        const daysLeft = days % 30;
        return `${months}个月${daysLeft}天`;
      }
      
      async function getLastUpdate() {
        try {
          const res = await fetch(`https://api.github.com/repos/${user}/${repo}/commits?per_page=1`);
          const data = await res.json();
          const date = new Date(data[0].commit.committer.date);
          const now = new Date();
          const days = Math.floor((now - date) / 86400000);
          if (days === 0) return '今天';
          if (days === 1) return '昨天';
          return `${days}天前`;
        } catch (e) {
          return '获取中';
        }
      }
      
      async function getTotalWords() {
        try {
          const res = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/main?recursive=1`);
          const data = await res.json();
          const mdFiles = data.tree.filter(item => item.path.endsWith('.md'));
          
          let totalWords = 0;
          for (const file of mdFiles) {
            const contentRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file.path}`);
            const contentData = await contentRes.json();
            const content = atob(contentData.content);
            totalWords += content.length;
          }
          
          if (totalWords >= 10000) {
            return (totalWords / 10000).toFixed(2) + ' 万';
          } else {
            return totalWords.toString();
          }
        } catch (e) {
          return '计算中';
        }
      }
      
      if (document.getElementById('runTime')) {
        document.getElementById('runTime').innerText = calcRunTime();
        getLastUpdate().then(str => {
          if (document.getElementById('lastUpdate')) {
            document.getElementById('lastUpdate').innerText = str;
          }
        });
        getTotalWords().then(str => {
          const wordEl = document.querySelector('.total-words');
          if (wordEl) {
            wordEl.innerText = str;
          }
        });
      }
    });
  </script>
