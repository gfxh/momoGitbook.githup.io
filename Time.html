    <div class="page-content" id="content">
      <div style="display: flex; gap: 2rem; background: transparent; padding: 1.5rem 2rem; border-radius: 12px; color: #fff; width: fit-content; margin: 0 auto; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);">

          <div style="font-size:14px;opacity:0.7;">当前时间</div>

          <div style="font-size:12px;opacity:0.7;margin-top:2px;" id="currentDate"></div>
        </div>
        
        
        
        <div style="text-align: center; min-width: 100px;">
          <div style="font-size:14px;opacity:0.7;">运营时长</div>
          <div style="font-size:28px;font-weight:bold;margin-top:4px;" id="runTime"></div>
        </div>
        <div style="text-align: center; min-width: 100px;">
          <div style="font-size:14px;opacity:0.7;">上次更新</div>

        </div>
        <div style="text-align: center; min-width: 100px;">
          <div style="font-size:14px;opacity:0.7;">总字数</div>

      </div>
    </div>

  <!-- 跳到顶部按钮 -->
  <button class="jump-to-top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="跳到顶部">⬆</button>
  
  <!-- 跳到目录按钮 -->
  <button class="jump-to-toc-btn" onclick="document.querySelector('.sidebar').scrollIntoView({behavior:'smooth'})" title="跳到目录">⬇</button>

  <script>
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function () {
      // 加载保存的主题偏好
      loadSavedTheme();
      
      // 统计卡片功能
      const BLOG_CREATE_DATE = '2025-12-18';
      
      function calcRunTime() {
        const start = new Date(BLOG_CREATE_DATE);
        const now = new Date();
        const days = Math.floor((now - start) / 86400000);
        const months = Math.floor(days / 30);
        const daysLeft = days % 30;
        return `${months}个月${daysLeft}天`;
      }
      
      async function getStats() {
        try {
          const res = await fetch('stats.json', { cache: 'no-cache' });
          if (!res.ok) {
            console.warn('Failed to fetch stats.json');
            return null;
          }
          return await res.json();
        } catch (e) {
          console.error('Failed to load stats:', e.message);
          return null;
        }
      }
      
      function formatLastUpdate(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const days = Math.floor((now - date) / 86400000);
        if (days === 0) return '今天';
        if (days === 1) return '昨天';
        return `${days}天前`;
      }
      
      function formatWords(count) {
        if (!count || count <= 0) {
          return '0';
        }
        if (count >= 10000) {
          const result = (count / 10000);
          if (result >= 10000) {
            return (result / 10000).toFixed(2) + ' 亿';
          }
          return result.toFixed(2) + ' 万';
        }
        return count.toString();
      }
      
      function updateCurrentTime() {
        const now = new Date();
        
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const weekDay = weekDays[now.getDay()];
        
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        if (document.getElementById('currentTime')) {
          document.getElementById('currentTime').innerText = `${hours}:${minutes}:${seconds}`;
        }
        if (document.getElementById('currentDate')) {
          document.getElementById('currentDate').innerText = `${year}-${month}-${day} ${weekDay}`;
        }
      }
      
      async function updateStats() {
        const stats = await getStats();
        
        if (stats) {
          if (document.getElementById('lastUpdate') && stats.lastUpdate) {
            document.getElementById('lastUpdate').innerText = formatLastUpdate(stats.lastUpdate);
          }
          if (document.querySelector('.total-words') && stats.totalWords) {
            document.querySelector('.total-words').innerText = formatWords(stats.totalWords);
          }
        }
      }
      
      // 添加动态效果
      function addDynamicEffects() {
        const cards = document.querySelectorAll('.page-content > div > div');
        cards.forEach((card, index) => {
          card.style.opacity = '0';
          card.style.transform = 'translateY(20px)';
          card.style.transition = 'all 0.5s ease';
          
          setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }, index * 100);
        });
      }
      
      if (document.getElementById('runTime')) {
        document.getElementById('runTime').innerText = calcRunTime();
        updateStats();
        updateCurrentTime();
        
        // 每秒更新时间
        setInterval(updateCurrentTime, 1000);
        
        // 添加入场动画
        setTimeout(addDynamicEffects, 100);
      }
    });
  </script>
